[project]
name = "my-music-stdio"
version = "0.1.0"
description = "Music practice workstation research and prototypes."
requires-python = ">=3.12,<3.13"
# NOTE: requirements.txt is the source of truth for runtime deps
# (environment.yml and README install from it). Keep this list in sync.
dependencies = [
    "matplotlib>=3.10",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "mido>=1.3",
    "pyfluidsynth>=1.3",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic-ai-slim[anthropic,openai]>=2.36.0",
    "pypdf>=5.0",
    "socksio",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint.flake8-bugbear]
# FastAPI's parameter markers are meant to be called in defaults.
extend-immutable-calls = ["fastapi.File", "fastapi.Body", "fastapi.Form", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
# Request / agent / PDF boundaries deliberately turn any failure into an error response instead of crashing.
"src/agent_api.py" = ["BLE001"]
"src/agent_client.py" = ["BLE001"]
"src/pdf_text.py" = ["BLE001"]
"src/server.py" = ["BLE001"]
# Standalone demo script, not part of the app.
"src/synth_wave_demo.py" = ["EXE001", "SIM115"]
